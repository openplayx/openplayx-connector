<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OpenPlayX Connector</title><link rel="stylesheet" href="/style.css"><script defer src="/platform.js"></script></head><body><main><header><h1>OpenPlayX Connector</h1><p>把这台机器上的服务接入你的平台账号。</p></header><p id="notice" role="status"></p><section id="login"><h2>登录本机管理页</h2><form id="login-form"><label>管理员密码或首次启动凭据<input id="admin-password" type="password" required autocomplete="current-password"></label><button>登录</button></form><p>首次凭据保存在机器上的 /var/lib/openplayx-connector/bootstrap-token，有效期 15 分钟。</p></section><div id="workspace" hidden><section id="admin-setup" hidden><h2>设置本机管理员密码</h2><form id="admin-form"><label>新密码<input id="new-password" type="password" required minlength="12" autocomplete="new-password"></label><label>确认密码<input id="confirm-password" type="password" required minlength="12" autocomplete="new-password"></label><button>保存并重新登录</button></form></section><section><h2>平台账号绑定</h2><form id="bind-form"><label>设备名称<input id="connector-name" value="VM Connector" required maxlength="128"></label><button>生成配对码</button></form><p id="binding"></p><a id="approval" hidden target="_blank" rel="noopener noreferrer">到平台确认绑定</a><p id="identity"></p></section><section><h2>中继节点</h2><form id="node-form"><label>固定使用节点<select id="nodes" required></select></label><button>保存节点</button></form><p>后台刷新不会自动切换节点。</p></section><section><h2>VM 内服务</h2><p>目标地址填写 127.0.0.1 或服务的局域网 IP；本机服务填写 VM 上实际监听的端口。目标地址只保存在这台机器上。</p><form id="service-form"><label>名称<input id="service-name" required maxlength="128" placeholder="例如：VM Jellyfin"></label><label>类型<select id="service-type"><option value="jellyfin">Jellyfin</option><option value="emby">Emby</option><option value="smb">SMB</option><option value="webdav">WebDAV</option><option value="other_tcp">其他 TCP 服务</option></select></label><label>目标地址<input id="service-host" value="127.0.0.1" required></label><label>目标端口<input id="service-port" type="number" min="1" max="65535" required placeholder="例如：18096"></label><button>注册服务并应用</button></form><div id="services"></div><p>注册完成后，在平台授权页面选择允许访问该服务的手机。</p><a href="https://api.openplayx.com/account/permissions" target="_blank" rel="noopener noreferrer">管理手机访问权限</a></section><section><h2>运行状态</h2><pre id="status"></pre><button id="refresh" type="button">刷新状态</button><button id="logout" type="button">退出本机管理</button></section></div></main></body></html>
